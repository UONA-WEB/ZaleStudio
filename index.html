<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#141318">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ZaleStudio · Nail Training</title>
<style>
:root{--bg:#141318;--panel:#1f1d24;--panel2:#2b2932;--line:#3a3742;--txt:#FAF7F1;--mut:#a39f9a;--acc:#c9a84c;--acc2:#e6b95f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header,.bar{background:var(--panel);display:flex;align-items:center;gap:2px;padding:4px 6px;overflow-x:auto;scrollbar-width:none;flex:0 0 auto}
header::-webkit-scrollbar,.bar::-webkit-scrollbar{display:none}
header{border-bottom:1px solid var(--line)}
footer{flex:0 0 auto;border-top:1px solid var(--line);background:var(--panel)}
#stage{position:relative;flex:1 1 auto;overflow:hidden;background:#0d0c10;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.brand{font-weight:700;letter-spacing:.14em;font-size:13px;padding:0 10px 0 6px;color:var(--acc);flex:0 0 auto}
.btn{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:54px;height:52px;padding:4px 6px;border:0;border-radius:10px;background:transparent;color:var(--txt);font:inherit;font-size:10.5px;cursor:pointer}
.btn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn:active{background:var(--panel2)}
.btn.on{background:var(--acc);color:#141318}
.btn:disabled{opacity:.3}
.sep{flex:0 0 1px;align-self:stretch;background:var(--line);margin:6px 4px}
.props{display:flex;align-items:center;gap:8px;padding:6px 10px;border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.props::-webkit-scrollbar{display:none}
.sw{flex:0 0 auto;width:32px;height:32px;border-radius:50%;border:2px solid #55525c;padding:0;cursor:pointer}
.sw.on{outline:3px solid var(--acc);outline-offset:2px}
.sw.custom{position:relative;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);overflow:hidden}
.sw.custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0;padding:0;cursor:pointer}
.sizes{display:flex;align-items:center;gap:6px;flex:0 0 auto;margin-left:10px;padding-left:12px;border-left:1px solid var(--line)}
.szb{flex:0 0 auto;width:48px;height:48px;border-radius:12px;border:2px solid transparent;background:var(--panel2);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;color:var(--txt)}
.szb.on{border-color:var(--acc);background:#3a3527}
.szb i{display:block;border-radius:50%}
.szb b{font-weight:700;line-height:1}
.sizebox{display:flex;align-items:center;gap:8px;flex:0 0 auto;margin-left:6px}
.sizebox label{font-size:11px;color:var(--mut)}
#size{width:170px;accent-color:var(--acc)}
#dot{width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
#dot i{display:block;border-radius:50%;background:#e53935}
#sizeV{font-size:12px;min-width:24px;text-align:right;color:var(--mut)}
#selbar{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:none;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#selbar.show{display:flex}
body.present header, body.present footer, body.present .side{display:none!important}
#presbar{position:absolute;top:10px;right:10px;display:none;gap:4px;z-index:6;background:rgba(31,29,36,.88);border:1px solid var(--line);border-radius:14px;padding:4px}
body.present #presbar{display:flex}
body.present #selbar{top:10px;left:10px;transform:none}
.tplmode{display:flex;gap:6px;margin:0 0 10px}
.tplmode button{flex:1;border:1px solid var(--line);background:var(--panel2);color:var(--txt);border-radius:10px;padding:9px 6px;font:inherit;font-size:12.5px;cursor:pointer}
.tplmode button.on{background:var(--acc);color:#141318;border-color:var(--acc)}
#selbar{max-width:calc(100% - 16px);overflow-x:auto;scrollbar-width:none}
#selbar::-webkit-scrollbar{display:none}
#toast{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:var(--panel2);color:var(--txt);padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1}
#home{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#24212b 0%,var(--bg) 70%);z-index:5;padding:20px}
#home.show{display:flex}
.side{position:absolute;top:0;bottom:0;width:min(300px,84vw);background:var(--panel);z-index:7;overflow-y:auto;touch-action:pan-y;
  visibility:hidden;transition:transform .22s ease,visibility 0s linear .22s;box-shadow:0 0 30px rgba(0,0,0,.55);padding:0 12px 16px;-webkit-overflow-scrolling:touch}
.side.left{left:0;transform:translateX(-106%);border-right:1px solid var(--line)}
.side.right{right:0;transform:translateX(106%);border-left:1px solid var(--line)}
.side.open{transform:none;visibility:visible;transition:transform .22s ease}
.sidehd{position:sticky;top:0;background:var(--panel);display:flex;align-items:center;justify-content:space-between;padding:12px 0 10px;z-index:1}
.sidehd b{font-family:"Playfair Display",Georgia,serif;font-size:18px;color:var(--acc2);font-weight:600}
.sidehd .x{border:0;background:var(--panel2);color:var(--txt);width:40px;height:40px;border-radius:10px;font-size:18px;cursor:pointer}
.tplgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tpl{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;cursor:pointer;padding:0;display:flex;flex-direction:column;font:inherit}
.tpl img{width:100%;aspect-ratio:3/4;object-fit:contain;background:#fff;display:block}
.tpl span{display:block;background:var(--bg);color:var(--txt);font-size:11.5px;padding:6px 4px;text-align:center;line-height:1.25}
.tpl:active{outline:3px solid var(--acc)}
.side h3{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin:16px 0 8px}
.side .hint{font-size:12px;color:var(--mut);margin:0 0 4px;line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel2);color:var(--txt);border-radius:999px;padding:9px 13px;font:inherit;font-size:13px;cursor:pointer}
.chip:active{background:var(--acc);color:#141318}
#app.is-empty footer{opacity:.35;pointer-events:none}
.homebox{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.homelogo{width:120px;height:120px;border-radius:28px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.homebox h1{margin:14px 0 0;font-family:"Playfair Display",Georgia,serif;font-weight:600;font-size:34px;color:var(--txt)}
.homebox p{margin:0 0 18px;color:var(--acc);letter-spacing:.2em;font-size:12px;text-transform:uppercase}
.homebtns{display:flex;flex-direction:column;gap:10px;width:min(320px,80vw)}
.pill.big{padding:16px;font-size:16px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
.modal.show{display:flex}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;width:min(560px,100%);max-height:90vh;display:flex;flex-direction:column;gap:12px}
.card h2{margin:0;font-size:17px;font-family:"Playfair Display",Georgia,serif;font-weight:600;color:var(--acc2)}
.card textarea{width:100%;min-height:110px;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:18px;resize:vertical;user-select:text;-webkit-user-select:text}
.actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.pill{border:0;border-radius:10px;padding:11px 18px;font:inherit;font-size:14px;font-weight:600;background:var(--panel2);color:var(--txt);cursor:pointer}
.pill.pri{background:var(--acc);color:#141318}
.pill.dan{background:#5a2328;color:#ffd9dc}
#plist{overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));grid-auto-rows:max-content;align-content:start;gap:10px;min-height:0;flex:1 1 auto}
.pj{background:var(--bg);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.pj img{width:100%;height:120px;object-fit:cover;background:#fff;display:block;cursor:pointer;flex:0 0 auto}
.pj .meta{padding:6px 8px;font-size:11px;color:var(--mut)}
.pj .row{display:flex;gap:4px;padding:0 6px 6px}
.pj .row button{flex:1;padding:7px 4px;font-size:12px}
.pj.cur{border-color:var(--acc)}
.empty{color:var(--mut);font-size:14px;padding:20px;text-align:center;grid-column:1/-1}
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="brand">ZALESTUDIO</span>
    <button class="btn" id="bOpen"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>Abrir foto</button>
    <button class="btn" id="bTpl"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="9" rx="1.5"/><rect x="3" y="15" width="7" height="6" rx="1.5"/><rect x="14" y="15" width="7" height="6" rx="1.5"/></svg>Plantillas</button>
    <button class="btn" id="bLbl"><svg viewBox="0 0 24 24"><rect x="2" y="3" width="13" height="8" rx="2"/><path d="M11 11l7 8M18 19l-4-.5M18 19l-.6-4"/></svg>Etiquetas</button>
    <button class="btn" id="bCalco"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="13" height="13" rx="2"/><rect x="8" y="8" width="13" height="13" rx="2" stroke-dasharray="3 2"/></svg>Calco</button>
    <button class="btn" id="bBlank"><svg viewBox="0 0 24 24"><path d="M6 3h9l5 5v13H6z"/><path d="M15 3v5h5"/><path d="M13 11v6M10 14h6"/></svg>Lienzo</button>
    <button class="btn" id="bProjects"><svg viewBox="0 0 24 24"><path d="M3 6h6l2 2h10v11H3z"/></svg>Trabajos</button>
    <span class="sep"></span>
    <button class="btn" id="bUndo"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>Deshacer</button>
    <button class="btn" id="bRedo"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg>Rehacer</button>
    <button class="btn" id="bFit"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Ajustar</button>
    <button class="btn" id="bClear"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Borrar todo</button>
    <span class="sep"></span>
    <button class="btn" id="bSave"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Guardar imagen</button>
    <button class="btn" id="bShare"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"/></svg>Compartir</button>
    <span class="sep"></span>
    <button class="btn" id="bPresent"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1"/><path d="M8 20h8M12 16v4"/></svg>Presentar</button>
    <span class="sep"></span>
    <button class="btn" id="bExit"><svg viewBox="0 0 24 24"><path d="M14 4h5v16h-5"/><path d="M10 8l-4 4 4 4M6 12h10"/></svg>Salir</button>
  </header>

  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="selbar">
      <span id="selN" style="display:none;align-self:center;font-size:12px;color:var(--acc);padding:0 8px"></span>
      <button class="btn arcp" data-pct="30"><b style="font-size:15px">30%</b>Curva C</button>
      <button class="btn arcp" data-pct="40"><b style="font-size:15px">40%</b>Curva C</button>
      <button class="btn arcp" data-pct="50"><b style="font-size:15px">50%</b>Curva C</button>
      <button class="btn" id="sFlip"><svg viewBox="0 0 24 24"><path d="M4 9Q12 1 20 9"/><path d="M4 15Q12 23 20 15" stroke-dasharray="2 3"/></svg>Invertir</button>
      <button class="btn" id="sFade"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" stroke-dasharray="2 2"/></svg>Más suave</button>
      <button class="btn" id="sSolid"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="currentColor"/></svg>Más visible</button>
      <button class="btn" id="sSmaller"><svg viewBox="0 0 24 24"><path d="M3 18l5-12 5 12M5 14h6"/><path d="M15 12h6"/></svg>Reducir</button>
      <button class="btn" id="sBigger"><svg viewBox="0 0 24 24"><path d="M3 18l5-12 5 12M5 14h6"/><path d="M15 12h6M18 9v6"/></svg>Ampliar</button>
      <button class="btn" id="sEdit"><svg viewBox="0 0 24 24"><path d="M4 20l4-1L19 8l-3-3L5 16z"/></svg>Editar</button>
      <button class="btn" id="sDup"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/></svg>Duplicar</button>
      <button class="btn" id="sDel"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Eliminar</button>
      <button class="btn" id="sOk"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>Listo</button>
    </div>
    <div id="toast"></div>
    <div id="presbar">
      <button class="btn" id="pUndo"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>Deshacer</button>
      <button class="btn" id="pExit"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>Salir</button>
    </div>
    <div id="home">
      <div class="homebox">
        <img src="icon-192.png" alt="" class="homelogo">
        <h1>ZaleStudio</h1>
        <p>Nail Training · by ZALESYA</p>
        <div class="homebtns">
          <button class="pill pri big" id="hOpen">Abrir foto</button>
          <button class="pill big" id="hTpl">Plantillas</button>
          <button class="pill big" id="hBlank">Lienzo en blanco</button>
          <button class="pill big" id="hProjects">Mis trabajos</button>
        </div>
      </div>
    </div>
    <aside class="side left" id="pTpl">
      <div class="sidehd"><b>Plantillas</b><button class="x" data-close="pTpl" aria-label="Cerrar">✕</button></div>
      <div class="tplmode"><button id="mOpen" class="on">Abrir como trabajo</button><button id="mCalco">Poner encima (calco)</button></div>
      <div class="tplgrid" id="tplGrid"></div>
    </aside>
    <aside class="side right" id="pLbl">
      <div class="sidehd"><b>Etiquetas</b><button class="x" data-close="pLbl" aria-label="Cerrar">✕</button></div>
      <p class="hint">Toca un nombre para ponerlo sobre la imagen. Arrastra la caja para moverla y el punto de la flecha para señalar la zona.</p>
      <h3>Anatomía</h3><div class="chips" id="lblA"></div>
      <h3>Estructura</h3><div class="chips" id="lblE"></div>
    </aside>
  </div>

  <footer>
    <div class="bar" id="tools">
      <button class="btn" data-tool="hand"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/></svg>Mover</button>
      <button class="btn" data-tool="select"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-2 6z"/></svg>Seleccionar</button>
      <span class="sep"></span>
      <button class="btn" data-tool="pen"><svg viewBox="0 0 24 24"><path d="M4 20l4-1L19 8l-3-3L5 16z"/><path d="M14 7l3 3"/></svg>Bolígrafo</button>
      <button class="btn" data-tool="marker"><svg viewBox="0 0 24 24"><path d="M9 15l-4 5h5l2-3"/><path d="M9 15l3 3 8-8-3-3z"/></svg>Rotulador</button>
      <button class="btn" data-tool="hl"><svg viewBox="0 0 24 24"><path d="M4 21h8"/><path d="M8 17l-2 2 3 1 1-2"/><path d="M8 17l4 4 8-8-4-4z"/></svg>Subrayador</button>
      <button class="btn" data-tool="erase"><svg viewBox="0 0 24 24"><path d="M8 20h12"/><path d="M4 15l9-9 6 6-8 8H8z"/><path d="M9 10l6 6"/></svg>Borrador</button>
      <button class="btn" data-tool="eraser"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" stroke-dasharray="3 3"/><path d="M9 9l6 6M15 9l-6 6"/></svg>Borrar zona</button>
      <span class="sep"></span>
      <button class="btn" data-tool="line"><svg viewBox="0 0 24 24"><path d="M5 19L19 5"/></svg>Línea</button>
      <button class="btn" data-tool="arrow"><svg viewBox="0 0 24 24"><path d="M5 19L19 5M10 5h9v9"/></svg>Flecha</button>
      <button class="btn" data-tool="arc"><svg viewBox="0 0 24 24"><path d="M4 18Q12 2 20 18"/></svg>Arco</button>
      <button class="btn" data-tool="ellipse"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="7"/></svg>Círculo</button>
      <button class="btn" data-tool="rect"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></svg>Rectángulo</button>
      <button class="btn" data-tool="text"><svg viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg>Texto</button>
      <span class="sep"></span>
      <button class="btn" data-tool="ok"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="#43a047"/><path d="M7.5 12.5l3 3 6-6.5" stroke="#43a047"/></svg>Bien</button>
      <button class="btn" data-tool="ko"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke="#e53935"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7" stroke="#e53935"/></svg>Corregir</button>
      <span class="sep"></span>
      <button class="btn" data-tool="angle"><svg viewBox="0 0 24 24"><path d="M4 20h16M4 20L15 5"/><path d="M10 20a6 6 0 0 0-2.4-4.8"/></svg>Ángulo</button>
      <button class="btn" data-tool="ratio"><svg viewBox="0 0 24 24"><path d="M3 12h18M3 8v8M14 9v6M21 8v8"/></svg>Proporción</button>
      <button class="btn" data-tool="ratio2"><svg viewBox="0 0 24 24"><path d="M7 3v11M4 3h6M4 14h6M16 10v11M13 10h6M13 21h6"/></svg>Almendra</button>
      <button class="btn" id="bSym"><svg viewBox="0 0 24 24"><path d="M12 3v18" stroke-dasharray="2 2"/><path d="M9 7L4 12l5 5M15 7l5 5-5 5"/></svg>Simetría</button>

    </div>
    <div class="props">
      <div id="colors" style="display:flex;gap:8px;align-items:center"></div>
      <div class="sizes" id="sizes"></div>
      <button class="btn" id="bPressure" style="display:none"><svg viewBox="0 0 24 24"><path d="M3 16c3 0 3-8 6-8s3 8 6 8 3-4 6-4"/></svg>Presión</button>
    </div>
  </footer>
</div>

<input type="file" id="file" accept="image/*" hidden>

<div class="modal" id="mText">
  <div class="card">
    <h2>Texto</h2>
    <textarea id="tIn" placeholder="Escribe aquí…"></textarea>
    <div class="actions">
      <button class="pill" id="tCancel">Cancelar</button>
      <button class="pill pri" id="tOk">Aceptar</button>
    </div>
  </div>
</div>

<div class="modal" id="mProjects">
  <div class="card">
    <h2>Mis trabajos</h2>
    <div id="plist"></div>
    <div class="actions"><button class="pill" id="pClose">Cerrar</button></div>
  </div>
</div>

<div class="modal" id="mConfirm">
  <div class="card">
    <h2 id="cTitle">¿Seguro?</h2>
    <div id="cMsg" style="font-size:14px;color:var(--mut)"></div>
    <div class="actions">
      <button class="pill" id="cNo">Cancelar</button>
      <button class="pill dan" id="cYes">Sí</button>
    </div>
  </div>
</div>

<script>
'use strict';
/* =========================================================
   ZaleStudio by ZALESYA — anotación sobre imágenes de uñas (v2.1)
   ========================================================= */
const $ = s => document.querySelector(s);
const stage = $('#stage'), cv = $('#cv'), ctx = cv.getContext('2d');
const ink = document.createElement('canvas'), ictx = ink.getContext('2d');

    act.last = ang; act.total += d;
    for (const o of S.sel) rotateObj(o, act.pivot.x, act.pivot.y, d);
    let deg = Math.round(act.total * 180 / Math.PI) % 360; if (deg > 180) deg -= 360; if (deg < -180) deg += 360;
    toast(`Girando ${deg}°`, 700);
    req(); return;
  }
  if (act.kind === 'handle') {
    const o = single(), h = act.h;
    if (!o) return;
    if (o.t === 'overlay') {   // calco: esquina = tamaño, lados = ancho / alto
      const l = rotPt(pt.x, pt.y, o.x, o.y, -(o.rot || 0)), dx = l.x - o.x, dy = l.y - o.y, mn = 20 / S.view.s;
      if (h === 'sw') o.iw = Math.max(mn, 2 * Math.abs(dx));
      else if (h === 'sh') o.ih = Math.max(mn, 2 * Math.abs(dy));
      else { const f = Math.max(0.05, Math.hypot(dx, dy) / (Math.hypot(o.iw / 2, o.ih / 2) || 1)); o.iw = Math.max(mn, o.iw * f); o.ih = Math.max(mn, o.ih * f); }
      req(); return;
    }
    if ((o.t === 'rect' || o.t === 'ellipse') && o.rot) {
      // forma girada: la esquina contraria se queda fija
      const k = centerOf(o), other = h === 'a' ? 'b' : 'a';
      const W2 = rotPt(o[other][0], o[other][1], k.x, k.y, o.rot);
      const nc = { x: (W2.x + pt.x) / 2, y: (W2.y + pt.y) / 2 };
      const A = rotPt(pt.x, pt.y, nc.x, nc.y, -o.rot), B = rotPt(W2.x, W2.y, nc.x, nc.y, -o.rot);
      o[h] = [A.x, A.y]; o[other] = [B.x, B.y];
      req(); return;
    }
    if (o.t === 'arc') {
      const g0 = arcInfo(o);
      const snap = (pct) => { const near = Math.round(pct * 20) / 20; return Math.abs(pct - near) < 0.012 ? near : pct; };
      if (h === 'a' || h === 'b') { const pct = g0 ? g0.pct : 0.3, side = g0 ? Math.sign(g0.sag) || 1 : 1; o[h] = [pt.x, pt.y]; setArcPct(o, pct, side); }
      else if (g0 && h === 'm') {   // altura: cambia el % (la perspectiva se mantiene)
        let sag = (pt.x - g0.mx) * g0.nx + (pt.y - g0.my) * g0.ny;
        const lim = g0.k * g0.h * Math.tan(0.9 * Math.PI / 2); sag = clamp(sag, -lim, lim);
        const pct = 4 * Math.atan(2 * Math.abs(sag / g0.k) / g0.L) / (2 * Math.PI), sn = snap(pct);
        if (sn !== pct) setArcPct(o, sn, Math.sign(sag) || 1); else o.m = [g0.mx + g0.nx * sag, g0.my + g0.ny * sag];
      }
      else if (g0 && h === 'q' && Math.abs(g0.sag) > 2 / S.view.s) {   // forma: ajusta la perspectiva sin mover la altura
        const v = (pt.x - g0.mx) * g0.nx + (pt.y - g0.my) * g0.ny;
        const pct = snap(pctFromRatio(v / g0.sag));
        const st = Math.sign(g0.sag) * g0.h * Math.tan(Math.PI * pct / 2);
        o.k = clamp(g0.sag / st, 0.08, 12);
      }
    } else o[h] = [pt.x, pt.y];
    req(); return;
  }
  if (act.kind === 'move') {
    const one = single();
    if (one && one.t === 'label') { one.x += pt.x - act.lx; one.y += pt.y - act.ly; }   // la caja se mueve, la punta sigue señalando
    else for (const o of S.sel) translate(o, pt.x - act.lx, pt.y - act.ly);
    act.lx = pt.x; act.ly = pt.y; req(); return;
  }
}

function finishAct(e) {
  const a = act; act = null;
  if (a.kind === 'draw') {
    if (a.raw) { const p = draft.p, n = p.length; if (dist(a.raw.x, a.raw.y, p[n-3], p[n-2]) > 0.3 / S.view.s) p.push(a.raw.x, a.raw.y, a.raw.pr); }
    cursor = null; S.objects.push(draft);
    const ax = axisObj(); if (ax) { const md = mirrorObj(draft, ax); if (md) S.objects.push(md); }
    draft = null; commit(); return;
  }
  if (a.kind === 'erase') { cursor = null; if (a.removed) commit(); req(); return; }

  if (a.kind === 'shape') {
    const o = draft; draft = null;
    if (!a.started || dist(o.a[0], o.a[1], o.b[0], o.b[1]) * S.view.s < 8) {
      // ha sido un toque: si hay una forma debajo, se selecciona; si no, se deselecciona lo que hubiera
      const hit = hitObject(o.a[0], o.a[1]);
      select(hit && hit.t !== 'eraser' ? hit : null); return;
    }
    if (o.t === 'angle') {   // segunda línea, paralela a la primera, para colocarla en el otro lateral
      const L = dist(o.a[0], o.a[1], o.b[0], o.b[1]) || 1, off = 60 / S.view.s;
      const nx = -(o.b[1] - o.a[1]) / L * off, ny = (o.b[0] - o.a[0]) / L * off;
      o.c = [o.a[0] + nx, o.a[1] + ny]; o.d = [o.b[0] + nx, o.b[1] + ny];
    }
    if (o.t === 'ratio2') {   // borde libre: al lado, empezando a la altura de la sonrisa y siguiendo hacia la punta
      const ux = o.b[0] - o.a[0], uy = o.b[1] - o.a[1], L = Math.hypot(ux, uy) || 1, off = 50 / S.view.s;
      const nx = -uy / L * off, ny = ux / L * off;
      o.c = [o.a[0] + ux * 0.75 + nx, o.a[1] + uy * 0.75 + ny]; o.d = [o.b[0] + ux * 0.75 + nx, o.b[1] + uy * 0.75 + ny];
    }
    S.objects.push(o);
    const ax = axisObj(); if (ax) { const md = mirrorObj(o, ax); if (md) S.objects.push(md); }
    commit(); select(o); return;
  }
  if (a.kind === 'stampTap') {
    const p = toDocS(a.sx, a.sy), k = S.tool === 'ko' ? 'ko' : 'ok';
    const o = { t: 'stamp', k, x: p.x, y: p.y, w: S.sizes[k] / S.view.s };
    S.objects.push(o); commit(); select(o); return;
  }
  if (a.kind === 'textTap') {
    if (a.started) { req(); return; }
    if (a.hadSel) { select(null); return; }          // primer toque fuera: solo deselecciona
    openText(null, a.pt); return;
  }
  if (a.kind === 'marquee') {
    const m = marquee; marquee = null;
    if (!a.started) { select(null); return; }
    const x1 = Math.min(m.x1, m.x2), x2 = Math.max(m.x1, m.x2), y1 = Math.min(m.y1, m.y2), y2 = Math.max(m.y1, m.y2);
    const found = S.objects.filter(o => {
      if (o.t === 'eraser') return false;
      const q = screenQuad(bboxOf(o), 0), xs = q.map(p => p.x), ys = q.map(p => p.y);
      return Math.max(...xs) > x1 && Math.min(...xs) < x2 && Math.max(...ys) > y1 && Math.min(...ys) < y2;
    });
    select(found);
    if (!found.length) toast('No hay nada dentro del recuadro');
    return;
  }
  if (a.kind === 'rotate') { if (a.started) commit(); req(); return; }
  if (a.kind === 'handle' || a.kind === 'move') {
    if (a.started) { commit(); return; }
    // toque sin arrastrar
    const one = single();
    if (a.kind === 'move' && one && TXT_TYPES.includes(one.t)) {
      const now = performance.now();
      if (!a.fresh && lastTap.o === one && now - lastTap.t < 450) { lastTap = { o: null, t: 0 }; editText(one); return; }
      lastTap = { o: one, t: now };
    }
    if (a.kind === 'move' && S.tool === 'select' && !a.fresh) {
      // tocar otra vez dentro de una selección múltiple: elegir solo ese elemento
      const pt = toDocS(a.sx, a.sy), hit = hitObject(pt.x, pt.y);
      if (hit && S.sel.length > 1) select(hit);
    }
    req(); return;
  }
  if (a.kind === 'pan') scheduleSave();
  req();
}
function cancelAct() {
  if (act && (act.kind === 'move' || act.kind === 'handle' || act.kind === 'rotate') && act.started) {
    S.objects = JSON.parse(hist[hIdx]); select(null);
  }
  if (act && act.kind === 'erase' && act.removed) { S.objects = JSON.parse(hist[hIdx]); select(null); }
  act = null; draft = null; marquee = null; cursor = null; req();
}

function eraseAt(x, y, sx, sy) { // borra los elementos enteros que toca
  const rPx = S.sizes.erase / 2;
  cursor = { x: sx, y: sy, r: rPx };
  const before = S.objects.length;
  S.objects = S.objects.filter(o => o.t === 'eraser' || o.t === 'overlay' || o.t === 'axis' || !hitsObj(o, x, y, rPx));
  if (S.objects.length !== before) act.removed += before - S.objects.length;
  req();
}

/* ---------- abrir imagen / lienzo ---------- */
function loadImg(src) {
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
}
async function askNew(what) {
  if (!hasWork()) return true;

}
$('#bOpen').onclick = async () => { if (await askNew('Abrir otra foto')) $('#file').click(); };
$('#file').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try {
    toast('Cargando imagen…');
    await saveNow();
    const url = URL.createObjectURL(f);
    const img = await loadImg(url);
    const k = Math.min(1, MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
    const c = document.createElement('canvas'); c.width = w; c.height = h;

    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.92));
    const bg = await loadImg(URL.createObjectURL(blob));
    newDoc(w, h, bg, blob);
    toast('Foto abierta. Dos dedos: ampliar, mover y girar');
  } catch (err) { console.error(err); toast('No se pudo abrir la imagen'); }
});

/* ---------- exportar ---------- */
function renderDoc(scale) {
  const w = Math.max(1, Math.round(S.docW * scale)), h = Math.max(1, Math.round(S.docH * scale));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, w, h);
  if (S.bg) { x.imageSmoothingQuality = 'high'; x.drawImage(S.bg, 0, 0, w, h); }
  x.save(); x.setTransform(scale, 0, 0, scale, 0, 0);
  EXPORTING = true;
  try { for (const o of S.objects) if (o.t === 'overlay') drawObj(x, o); } finally { EXPORTING = false; x.restore(); }
  const k = document.createElement('canvas'); k.width = w; k.height = h;
  const kx = k.getContext('2d'); kx.setTransform(scale, 0, 0, scale, 0, 0);
  EXPORTING = true;
  try { for (const o of S.objects) if (o.t !== 'overlay') drawObj(kx, o); } finally { EXPORTING = false; }
  x.drawImage(k, 0, 0);
  return c;
}

/* ---------- trabajos (IndexedDB, en la propia tablet) ---------- */
const DB = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('zalestudio', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('projects', { keyPath: 'id' });
      r.onsuccess = () => res(this.db = r.result);
      r.onerror = () => rej(r.error);
    });
  },
  async run(mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const tx = db.transaction('projects', mode), st = tx.objectStore('projects'), rq = fn(st);
      tx.oncomplete = () => res(rq && rq.result); tx.onerror = () => rej(tx.error);
    });
  },
  put(v) { return this.run('readwrite', s => s.put(v)); },
  get(id) { return this.run('readonly', s => s.get(id)); },
  all() { return this.run('readonly', s => s.getAll()); },
  del(id) { return this.run('readwrite', s => s.delete(id)); }
};
let saveT = 0, dirty = false;
function scheduleSave() { dirty = true; clearTimeout(saveT); saveT = setTimeout(saveNow, 1200); }
async function saveNow(force) {
  clearTimeout(saveT);
  if (!dirty && !force) return;
  dirty = false;
  if (!hasWork()) return;
  try {
    if (!S.projectId) S.projectId = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    const sc = Math.min(1, 360 / Math.max(S.docW, S.docH));
    const thumb = renderDoc(sc).toDataURL('image/jpeg', 0.75);
    await DB.put({ id: S.projectId, name: S.projectName || nowName(), updated: Date.now(),
                   docW: S.docW, docH: S.docH, bg: S.bgBlob, objects: S.objects, thumb, view: { ...S.view } });
    localStorage.setItem('zalestudio-last', S.projectId);
  } catch (err) { console.error(err); toast('No se pudo guardar el trabajo'); }
}
async function openProject(id, keepView) {
  const p = await DB.get(id); if (!p) return false;
  if (S.bg && S.bg.src && S.bg.src.startsWith('blob:')) URL.revokeObjectURL(S.bg.src);
  S.docW = p.docW; S.docH = p.docH; S.bgBlob = p.bg || null;
  S.bg = p.bg ? await loadImg(URL.createObjectURL(p.bg)) : null;
  S.objects = p.objects || []; S.projectId = p.id; S.projectName = p.name;
  setEmpty(false); select(null); resetHist();
  if (keepView && p.view) { S.view = { r: 0, ...p.view }; render(); } else fit();
  localStorage.setItem('zalestudio-last', p.id);
  return true;
}
async function showProjects() {
  await saveNow();
  const list = (await DB.all()).sort((a, b) => b.updated - a.updated);
  const box = $('#plist'); box.innerHTML = '';
  if (!list.length) box.innerHTML = '<div class="empty">Aún no hay trabajos guardados.<br>Se guardan solos mientras dibujas.</div>';
  for (const p of list) {
    const d = document.createElement('div'); d.className = 'pj' + (p.id === S.projectId ? ' cur' : '');
    const dt = new Date(p.updated);
    d.innerHTML = `<img alt=""><div class="meta"></div><div class="row"><button class="pill pri">Abrir</button><button class="pill dan">Borrar</button></div>`;
    d.querySelector('img').src = p.thumb;
    d.querySelector('.meta').textContent = `${p.name} · ${dt.toLocaleDateString('es-ES')}`;
    const open = async () => { $('#mProjects').classList.remove('show'); await openProject(p.id); };
    d.querySelector('img').onclick = open;
    d.querySelector('.pill.pri').onclick = open;
    d.querySelector('.pill.dan').onclick = async () => {
      if (!(await confirmBox('Borrar trabajo', `Se borrará "${p.name}" de esta tablet. No se puede deshacer.`, 'Borrar'))) return;
      await DB.del(p.id);
      if (p.id === S.projectId) goHome();
      showProjects();

  $('#mProjects').classList.add('show');
}

$('#hTpl').onclick = () => { setTplMode('open'); setPanel('pTpl', true); };
$('#bLbl').onclick = () => togglePanel('pLbl');
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => setPanel(b.dataset.close, false));
(function buildPanels() {
  const g = $('#tplGrid');
  TEMPLATES.forEach(t => {
    const b = document.createElement('button'); b.className = 'tpl';
    b.innerHTML = `<img loading="lazy" alt=""><span></span>`;
    b.querySelector('img').src = t.f; b.querySelector('span').textContent = t.n;
    b.onclick = () => openTemplate(t); g.appendChild(b);
  });
  const mk = (list, box) => list.forEach(txt => {
    const b = document.createElement('button'); b.className = 'chip'; b.textContent = txt;
    b.onclick = () => { addLabel(txt); if (narrow()) setPanel('pLbl', false); };
    $(box).appendChild(b);
  });
  mk(LABELS_ANAT, '#lblA'); mk(LABELS_EST, '#lblE');
})();
let tplMode = 'open';
function setTplMode(m) {
  tplMode = m;
  $('#mOpen').classList.toggle('on', m === 'open'); $('#mCalco').classList.toggle('on', m === 'calco');
}
$('#mOpen').onclick = () => setTplMode('open');
$('#mCalco').onclick = () => { if (S.empty) { toast('Abre primero una foto o una plantilla'); return; } setTplMode('calco'); };
$('#bCalco').onclick = () => { if (S.empty) { toast('Abre primero una foto'); return; } setTplMode('calco'); setPanel('pTpl', true); };
async function addOverlay(t) {
  const im = tplImg(t.f);
  if (!(im.complete && im.naturalWidth)) await new Promise((res, rej) => { im.addEventListener('load', res, { once: true }); im.addEventListener('error', rej, { once: true }); });
  const f = Math.min(0.7 * W / im.naturalWidth, 0.7 * H / im.naturalHeight), c = toDocS(W / 2, H / 2);
  const o = { t: 'overlay', f: t.f, n: t.n, x: c.x, y: c.y, iw: im.naturalWidth * f / S.view.s, ih: im.naturalHeight * f / S.view.s, rot: -S.view.r, alpha: 0.5 };
  S.objects.push(o); commit(); setTool('select'); select(o);
  toast('Calco: muévelo, gíralo y ajusta el tamaño con los puntos');
}
$('#sFade').onclick = () => { const o = single(); if (o && o.t === 'overlay') { o.alpha = Math.max(0.1, o.alpha - 0.15); commit(); } };
$('#sSolid').onclick = () => { const o = single(); if (o && o.t === 'overlay') { o.alpha = Math.min(1, o.alpha + 0.15); commit(); } };
$('#bSym').onclick = () => {
  if (S.empty) return;
  const ax = axisObj();
  if (ax) { S.objects = S.objects.filter(o => o.t !== 'axis'); select(null); commit(); toast('Simetría desactivada'); return; }
  const a = toDocS(W / 2, H * 0.08), b = toDocS(W / 2, H * 0.92);
  const o = { t: 'axis', a: [a.x, a.y], b: [b.x, b.y], w: 2 / S.view.s, color: '#00bcd4' };
  S.objects.push(o); commit(); setTool('select'); select(o);
  toast('Simetría: coloca el eje en el centro de la uña. Lo que dibujes se refleja al otro lado');
};
let presFS = false;
function setPresent(v) {
  const c = W ? toDocS(W / 2, H / 2) : null;
  document.body.classList.toggle('present', v);
  setPanel('pTpl', false); setPanel('pLbl', false);
  try {
    if (v && document.documentElement.requestFullscreen && !document.fullscreenElement)
      document.documentElement.requestFullscreen().then(() => { presFS = true; }).catch(() => {});
    else if (!v && document.fullscreenElement && presFS) { presFS = false; document.exitFullscreen().catch(() => {}); }
  } catch (_) {}
  requestAnimationFrame(() => { resize(); if (c) { placeView(c.x, c.y, W / 2, H / 2); render(); } });
}
$('#bPresent').onclick = () => { if (!S.empty) setPresent(true); };
$('#pExit').onclick = () => setPresent(false);
$('#pUndo').onclick = () => undo();
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement && presFS) { presFS = false; if (document.body.classList.contains('present')) setPresent(false); }
});
async function openTemplate(t) {
  setPanel('pTpl', false);
  if (tplMode === 'calco' && !S.empty) { try { await addOverlay(t); } catch (err) { console.error(err); toast('No se pudo poner el calco'); } return; }
  if (!(await askNew('Abrir plantilla'))) return;
  try {
    toast('Cargando plantilla…');
    await saveNow();
    const r = await fetch(t.f); if (!r.ok) throw new Error(r.status);
    const blob = await r.blob(), img = await loadImg(URL.createObjectURL(blob));
    newDoc(img.naturalWidth, img.naturalHeight, img, blob);
    S.projectName = t.n; scheduleSave();
    toast(t.n);
  } catch (err) { console.error(err); toast('No se pudo abrir la plantilla'); }
}
$('#bExit').onclick = async () => {
  select(null);
  if (hasWork()) await saveNow(true);
  goHome();
  window.close();   // en Android, si el sistema no deja cerrar desde la app, se queda en la pantalla de inicio
  setTimeout(() => toast('Trabajo guardado. Para cerrar del todo, desliza la app hacia arriba', 3500), 300);
};

/* guardar al salir o pasar a segundo plano */
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveNow(); });
window.addEventListener('pagehide', () => saveNow());

/* ---------- inicio ---------- */
document.querySelectorAll('[data-tool]').forEach(b => b.onclick = () => setTool(b.dataset.tool));
buildColors();
window.addEventListener('resize', () => { const had = W; resize(); if (!had) fit(); });
resize();
setTool('pen');
$('#bPressure').classList.toggle('on', S.pressure);
goHome();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
